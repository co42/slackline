[package]
name = "slackline"
version = "1.4.0"
edition = "2024"
description = "Slack CLI"
license = "MIT"
repository = "https://github.com/co42/slackline"
authors = ["Corentin Regal"]
readme = "README.md"
keywords = ["slack", "cli", "api"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
dotenvy = "0.15"
futures = "0.3"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http2", "ring", "rustls-native-certs", "native-tokio", "logging"] }
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "charset", "http2", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slack-morphism = { version = "2.24", features = ["hyper"] }
thiserror = "2"
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
urlencoding = "2"
